<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ballista Yunani Kuno - Model 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#10131a; font-family:'Segoe UI',Tahoma,sans-serif; }
  #app { display:block; width:100vw; height:100vh; }
  #hud {
    position:fixed; top:16px; left:16px; z-index:10;
    background:rgba(16,19,26,0.72); backdrop-filter:blur(8px);
    border:1px solid rgba(214,178,110,0.35); border-radius:14px;
    padding:14px 18px; color:#eadfce; max-width:280px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  #hud h1 { font-size:17px; margin-bottom:6px; color:#d6b26e; letter-spacing:.4px; }
  #hud p { font-size:12.5px; line-height:1.6; color:#cbbfa8; }
  #hud .ctl { margin-top:10px; font-size:12.5px; color:#cbbfa8; display:flex; align-items:center; gap:8px; }
  #hud input { accent-color:#d6b26e; }
  #tag { position:fixed; bottom:14px; right:16px; z-index:10; color:#6b6454; font-size:11px; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#d6b26e; font-size:15px; z-index:20; background:#10131a; }
</style>
</head>
<body>
<div id="loading">Memuatkan model 3D…</div>
<div id="hud">
  <h1>Ballista Yunani Kuno</h1>
  <p>Katapel torsi (oxybeles). Seret tetikus untuk putar · skrol untuk zum · klik kanan untuk geser.</p>
  <label class="ctl"><input type="checkbox" id="auto" checked> Putaran automatik</label>
</div>
<div id="tag">WebGL - Three.js</div>
<canvas id="app"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9b996);
scene.fog = new THREE.Fog(0xc9b996, 34, 80);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 400);
camera.position.set(10, 6.5, 12);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 5;
controls.maxDistance = 36;
controls.maxPolarAngle = Math.PI*0.49;
controls.target.set(0, 2.4, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
document.getElementById('auto').addEventListener('change', e => controls.autoRotate = e.target.checked);

const hemi = new THREE.HemisphereLight(0xfff0d0, 0x5a4a30, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1cf, 2.0);
sun.position.set(13, 19, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=1; sun.shadow.camera.far=70;
sun.shadow.camera.left=-20; sun.shadow.camera.right=20; sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
sun.shadow.bias=-0.0004; scene.add(sun);
const fill = new THREE.DirectionalLight(0x88a0d0, 0.45); fill.position.set(-10,7,-9); scene.add(fill);

// ---------- textures ----------
function woodTexture(base, grain, rep) {
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
  g.fillStyle=base; g.fillRect(0,0,512,512);
  for(let i=0;i<95;i++){ g.strokeStyle=grain; g.globalAlpha=0.04+Math.random()*0.10; g.lineWidth=1+Math.random()*3;
    g.beginPath(); let y=Math.random()*512; g.moveTo(0,y);
    for(let x=0;x<=512;x+=16){ g.lineTo(x, y+Math.sin(x*0.02+i)*6+(Math.random()-0.5)*4);} g.stroke(); }
  g.globalAlpha=1;
  for(let i=0;i<7;i++){ const kx=Math.random()*512,ky=Math.random()*512,kr=4+Math.random()*9;
    const rg=g.createRadialGradient(kx,ky,1,kx,ky,kr); rg.addColorStop(0,grain); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.beginPath(); g.arc(kx,ky,kr,0,7); g.fill(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep||2,rep||2); t.colorSpace=THREE.SRGBColorSpace; return t;
}
// Greek meander (key) pattern band
function meanderTexture() {
  const c=document.createElement('canvas'); c.width=512; c.height=128; const g=c.getContext('2d');
  g.fillStyle='#9c6a33'; g.fillRect(0,0,512,128);
  g.strokeStyle='#2a1a0c'; g.lineWidth=10; g.lineJoin='miter';
  const u=28; const y0=22; 
  for(let k=0;k<512/ (u*4); k++){
    const ox=k*u*4;
    g.beginPath();
    g.moveTo(ox+0, y0+u*3);
    g.lineTo(ox+0, y0+0);
    g.lineTo(ox+u*3, y0+0);
    g.lineTo(ox+u*3, y0+u*2);
    g.lineTo(ox+u, y0+u*2);
    g.lineTo(ox+u, y0+u);
    g.lineTo(ox+u*2, y0+u);
    g.stroke();
  }
  // terracotta top/bottom lines
  g.strokeStyle='#7a3b22'; g.lineWidth=8;
  g.beginPath(); g.moveTo(0,8); g.lineTo(512,8); g.moveTo(0,120); g.lineTo(512,120); g.stroke();
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping; t.repeat.set(6,1); t.colorSpace=THREE.SRGBColorSpace; return t;
}

const woodTex=woodTexture('#9c6a33','#45280f',3);
const darkWoodTex=woodTexture('#6b4420','#2c1908',2);
const matWood=new THREE.MeshStandardMaterial({map:woodTex,roughness:0.8,metalness:0.04,color:0xe2bf92});
const matDarkWood=new THREE.MeshStandardMaterial({map:darkWoodTex,roughness:0.84,metalness:0.04,color:0xcfa678});
const matBronze=new THREE.MeshStandardMaterial({color:0xb5842f,roughness:0.35,metalness:0.92});
const matBronzeDark=new THREE.MeshStandardMaterial({color:0x8a6321,roughness:0.5,metalness:0.85});
const matRope=new THREE.MeshStandardMaterial({color:0xd8c38a,roughness:0.95,metalness:0.0});
const matString=new THREE.MeshStandardMaterial({color:0x3a2d1a,roughness:0.6,metalness:0.1});
const matSteel=new THREE.MeshStandardMaterial({color:0x9fa6ad,roughness:0.28,metalness:1.0});
const matMeander=new THREE.MeshStandardMaterial({map:meanderTexture(),roughness:0.7,metalness:0.1,color:0xd8c29a});

// ---------- ground ----------
const groundTex=woodTexture('#b8a079','#8a7450',12);
const ground=new THREE.Mesh(new THREE.CircleGeometry(60,64),
  new THREE.MeshStandardMaterial({map:groundTex,roughness:1.0,color:0xc9b48c}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

function mesh(geo,mat,cast=true){ const m=new THREE.Mesh(geo,mat); m.castShadow=cast; m.receiveShadow=true; return m; }
function orientCyl(m,a,b){ const d=new THREE.Vector3().subVectors(b,a); const l=d.length();
  m.position.copy(a).add(b).multiplyScalar(0.5); m.scale.set(1,l,1);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize()); }

// ===================================================================
//  GREEK TORSION BALLISTA (oxybeles) on a stand
// ===================================================================
const ballista = new THREE.Group();
ballista.position.y = 0.63;   // raised so the wheels rest on the ground
scene.add(ballista);

// ---- Wheeled wooden carriage ----
const stand = new THREE.Group(); ballista.add(stand);
// rectangular chassis
for (const x of [-1.6, 1.6]) {
  const beam = mesh(new THREE.BoxGeometry(0.5, 0.4, 5.0), matDarkWood);
  beam.position.set(x, 0.22, 0); stand.add(beam);
}
for (const z of [-2.0, 0, 2.0]) {
  const cb = mesh(new THREE.BoxGeometry(3.7, 0.38, 0.5), matDarkWood);
  cb.position.set(0, 0.22, z); stand.add(cb);
}
// four wooden spoked wheels
function woodWheel() {
  const g = new THREE.Group();
  const rim = mesh(new THREE.TorusGeometry(0.85, 0.14, 14, 32), matWood); g.add(rim);
  const tyre = mesh(new THREE.TorusGeometry(0.85, 0.06, 10, 32), matBronzeDark); g.add(tyre);
  const hub = mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.42, 16), matWood);
  hub.rotation.x = Math.PI/2; g.add(hub);
  for (let i=0;i<4;i++){
    const sp = mesh(new THREE.BoxGeometry(0.1, 1.42, 0.11), matWood);
    sp.rotation.z = (i/4)*Math.PI; g.add(sp);
  }
  g.rotation.y = Math.PI/2; // axle along X, wheel rolls fore-and-aft
  return g;
}
for (const [x,z] of [[-1.95,-1.9],[1.95,-1.9],[-1.95,1.9],[1.95,1.9]]) {
  const w = woodWheel(); w.position.set(x, 0.22, z); stand.add(w);
}
// axles
for (const z of [-1.9, 1.9]) {
  const ax = mesh(new THREE.CylinderGeometry(0.1,0.1,4.1,12), matBronzeDark);
  ax.rotation.z = Math.PI/2; ax.position.set(0, 0.22, z); stand.add(ax);
}
// central pillar
const pillar = mesh(new THREE.CylinderGeometry(0.5,0.65,3.2,16), matWood);
pillar.position.y = 1.9; stand.add(pillar);
const collar = mesh(new THREE.CylinderGeometry(0.58,0.58,0.3,16), matBronze);
collar.position.y = 3.3; stand.add(collar);
// pivot yoke
const yokeAxle = mesh(new THREE.CylinderGeometry(0.16,0.16,1.6,14), matBronze);
yokeAxle.rotation.z = Math.PI/2; yokeAxle.position.y = 3.55; stand.add(yokeAxle);

// ---- Upper (weapon) assembly ----
const upper = new THREE.Group();
upper.position.set(0, 3.55, 0);
upper.rotation.x = 0.15;   // muzzle tilted slightly UPWARD
ballista.add(upper);

const FRONT = -3.2; // front case z

// main stock (syrinx / case)
const stock = mesh(new THREE.BoxGeometry(0.85, 0.55, 6.6), matWood);
stock.position.set(0, 0, -0.7); upper.add(stock);
// top slider groove
const groove = mesh(new THREE.BoxGeometry(0.36, 0.18, 6.6), matDarkWood);
groove.position.set(0, 0.33, -0.7); upper.add(groove);
// meander decoration bands on both sides of the stock
for (const s of [-1,1]) {
  const band = mesh(new THREE.PlaneGeometry(6.6, 0.46), matMeander, false);
  band.position.set(s*0.431, 0.02, -0.7);
  band.rotation.y = s>0 ? Math.PI/2 : -Math.PI/2;
  upper.add(band);
}

// front case cross-frame (holds the two torsion springs)
const crossLow = mesh(new THREE.BoxGeometry(5.0, 0.7, 0.7), matDarkWood);
crossLow.position.set(0, 0.0, FRONT); upper.add(crossLow);
const crossTop = mesh(new THREE.BoxGeometry(5.0, 0.55, 0.55), matDarkWood);
crossTop.position.set(0, 1.55, FRONT); upper.add(crossTop);
for (const s of [-1,1]) {
  const upright = mesh(new THREE.BoxGeometry(0.5, 2.0, 0.6), matDarkWood);
  upright.position.set(s*2.5, 0.78, FRONT); upper.add(upright);
}

// torsion springs + bow arms
const arms = [];
function springSide(side) {
  const g = new THREE.Group();
  g.position.set(side*1.9, 0.78, FRONT); upper.add(g);
  // twisted rope skein
  const skein = mesh(new THREE.CylinderGeometry(0.4,0.4,2.0,18), matRope); g.add(skein);
  for (let i=0;i<11;i++){
    const ring = mesh(new THREE.TorusGeometry(0.41,0.06,8,20), matRope);
    ring.rotation.x=Math.PI/2; ring.position.y=-0.9+i*0.18; ring.rotation.z=i*0.5; g.add(ring);
  }
  for (const y of [1.0,-1.0]) {
    const plate = mesh(new THREE.CylinderGeometry(0.52,0.52,0.18,20), matBronze);
    plate.position.y=y; g.add(plate);
  }
  // bow arm (drawn back to the string)
  const armPivot = new THREE.Group(); g.add(armPivot);
  armPivot.rotation.y = -side * 0.42;  // pulled toward the rear
  const arm = mesh(new THREE.BoxGeometry(0.26,0.26,2.7), matDarkWood);
  arm.position.set(side*0.38, 0, -1.2); arm.rotation.y = side*0.5; armPivot.add(arm);
  const cap = mesh(new THREE.CylinderGeometry(0.16,0.11,0.4,12), matBronze);
  cap.position.set(side*0.95,0,-2.3); cap.rotation.x=Math.PI/2; cap.rotation.z=side*0.5; armPivot.add(cap);
  const tipObj = new THREE.Object3D(); tipObj.position.set(side*1.0,0,-2.35); armPivot.add(tipObj);
  arms.push(tipObj);
  return g;
}
springSide(-1); springSide(1);

// trigger block / nock carriage (fixed, drawn position)
const nockZ = 1.4;
const carriage = mesh(new THREE.BoxGeometry(0.7,0.45,0.9), matBronzeDark);
carriage.position.set(0,0.42,nockZ); upper.add(carriage);
const claw = mesh(new THREE.CylinderGeometry(0.1,0.1,0.8,10), matBronze);
claw.rotation.z=Math.PI/2; claw.position.set(0,0.62,nockZ-0.35); upper.add(claw);

// bolt resting in the groove
const boltGrp = new THREE.Group(); upper.add(boltGrp);
const shaft = mesh(new THREE.CylinderGeometry(0.08,0.08,3.4,12), matWood);
shaft.rotation.x=Math.PI/2; boltGrp.add(shaft);
const head = mesh(new THREE.ConeGeometry(0.17,0.6,14), matSteel);
head.rotation.x=-Math.PI/2; head.position.z=-1.9; boltGrp.add(head);
for (let i=0;i<3;i++){
  const holder=new THREE.Group(); holder.rotation.z=(i/3)*Math.PI*2;
  const fin=mesh(new THREE.BoxGeometry(0.02,0.3,0.6), new THREE.MeshStandardMaterial({color:0x8a3b2a,roughness:0.85}));
  fin.position.set(0.13,0,1.5); holder.add(fin); boltGrp.add(holder);
}
boltGrp.position.set(0,0.46,nockZ-0.2);

// rear winch
const winch=new THREE.Group(); winch.position.set(0,0.0,2.6); upper.add(winch);
const drum=mesh(new THREE.CylinderGeometry(0.33,0.33,1.3,18), matDarkWood); drum.rotation.z=Math.PI/2; winch.add(drum);
for (const x of [-0.72,0.72]) {
  const h=mesh(new THREE.CylinderGeometry(0.06,0.06,0.5,10), matBronze); h.position.set(x,0,0.32); winch.add(h);
  const grip=mesh(new THREE.CylinderGeometry(0.05,0.05,0.4,10), matWood); grip.rotation.x=Math.PI/2; grip.position.set(x,0,0.56); winch.add(grip);
  const gear=mesh(new THREE.CylinderGeometry(0.27,0.27,0.1,16), matBronze); gear.rotation.z=Math.PI/2; gear.position.x=x*0.9; winch.add(gear);
}

// bowstring (static)
const strL=mesh(new THREE.CylinderGeometry(0.035,0.035,1,8), matString, false);
const strR=mesh(new THREE.CylinderGeometry(0.035,0.035,1,8), matString, false);
upper.add(strL); upper.add(strR);

// place string once (model is static)
upper.updateWorldMatrix(true, true);
const tA=new THREE.Vector3(), tB=new THREE.Vector3();
arms[0].getWorldPosition(tA); upper.worldToLocal(tA);
arms[1].getWorldPosition(tB); upper.worldToLocal(tB);
const nock=new THREE.Vector3(0,0.6,nockZ-0.1);
orientCyl(strL, tA, nock); orientCyl(strR, tB, nock);

// ---------- loop ----------
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
function animate(){ controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate); }
document.getElementById('loading').style.display='none';
animate();
</script>
</body>
</html>
